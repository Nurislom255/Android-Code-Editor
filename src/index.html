<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="UTF-8" />
  <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
       Android Chrome shrinks the layout (not just the visual viewport), so the
       coding-keys bar sits right above the keyboard instead of behind it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#14161a" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Offline-first code editor for Android phones and tablets." />
  <title>CodeEditor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme before first paint, so dark-mode users never see
    // a white flash while the app script loads.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('codeeditor:settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.className = 'theme-' + t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="layout-compact">
    <header id="titlebar" role="banner">
      <button id="btn-sidebar" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl+B)" data-icon="menu"></button>
      <button id="btn-project" class="project-btn" title="Switch project">
        <span id="project-name">No project</span><span class="caret" data-icon="chevronDown"></span>
      </button>
      <div class="spacer"></div>
      <div class="title-actions">
        <button id="btn-back" class="icon-btn wide-only" aria-label="Go back" title="Go back (Ctrl+Alt+-)" data-icon="back"></button>
        <button id="btn-forward" class="icon-btn wide-only" aria-label="Go forward" title="Go forward (Ctrl+Shift+-)" data-icon="forward"></button>
        <button id="btn-undo" class="icon-btn" aria-label="Undo" title="Undo (Ctrl+Z)" data-icon="undo"></button>
        <button id="btn-redo" class="icon-btn" aria-label="Redo" title="Redo (Ctrl+Y)" data-icon="redo"></button>
        <button id="btn-save" class="icon-btn" aria-label="Save" title="Save (Ctrl+S)" data-icon="save"></button>
        <button id="btn-split" class="icon-btn wide-only" aria-label="Split editor" title="Split editor (Ctrl+\)" data-icon="split"></button>
        <button id="btn-palette" class="icon-btn" aria-label="Command palette" title="Command palette (Ctrl+Shift+P)" data-icon="command"></button>
        <button id="btn-run" class="run-btn" aria-label="Run" title="Run JS / preview HTML or Markdown (F5)">
          <span data-icon="play"></span><span class="run-label">Run</span>
        </button>
      </div>
    </header>

    <div id="workbench">
      <nav id="activitybar" aria-label="Side panels">
        <button class="activity" data-panel="files" aria-label="Files" title="Files" data-icon="files"></button>
        <button class="activity" data-panel="search" aria-label="Search" title="Search in project (Ctrl+Shift+F)" data-icon="search"></button>
        <button class="activity" data-panel="outline" aria-label="Outline" title="Outline" data-icon="outline"></button>
        <button class="activity" data-panel="git" aria-label="Source control" title="Source control (git)" data-icon="git"></button>
        <button class="activity" data-panel="history" aria-label="Local history" title="Local history" data-icon="history"></button>
        <div class="spacer"></div>
        <button class="activity" data-panel="settings" aria-label="Settings" title="Settings" data-icon="settings"></button>
      </nav>

      <aside id="sidebar" aria-label="Sidebar">
        <div class="sidebar-tabs" role="tablist"></div>
        <section class="side-panel" data-panel="files"></section>
        <section class="side-panel" data-panel="search"></section>
        <section class="side-panel" data-panel="outline"></section>
        <section class="side-panel" data-panel="git"></section>
        <section class="side-panel" data-panel="history"></section>
        <section class="side-panel" data-panel="settings"></section>
      </aside>
      <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
      <div id="scrim"></div>

      <main id="editor-area">
        <section class="pane" id="pane-0" data-pane="0">
          <div class="tab-bar" role="tablist"></div>
          <div class="crumbs"></div>
          <div class="conflict-bar hidden"></div>
          <div class="editor-host"></div>
          <div class="pane-empty"></div>
        </section>
        <div id="pane-divider" class="pane-divider hidden" role="separator" aria-label="Resize panes"></div>
        <section class="pane hidden" id="pane-1" data-pane="1">
          <div class="tab-bar" role="tablist"></div>
          <div class="crumbs"></div>
          <div class="conflict-bar hidden"></div>
          <div class="editor-host"></div>
          <div class="pane-empty"></div>
        </section>
        <section id="preview-side" class="hidden" aria-label="Preview"></section>
      </main>
    </div>

    <section id="bottom-panel" class="collapsed" aria-label="Console and preview">
      <div id="panel-resizer" role="separator" aria-label="Resize panel"><span></span></div>
      <div class="panel-head">
        <div class="panel-tabs" role="tablist">
          <button class="panel-tab active" data-tab="console" role="tab">Console</button>
          <button class="panel-tab" data-tab="preview" role="tab">Preview</button>
          <button class="panel-tab" data-tab="problems" role="tab">Problems <span id="problems-count" class="badge hidden">0</span></button>
        </div>
        <div class="spacer"></div>
        <div class="panel-actions"></div>
      </div>
      <div class="panel-body">
        <div id="console-view" class="panel-view" data-tab="console"></div>
        <div id="preview-view" class="panel-view hidden" data-tab="preview"></div>
        <div id="problems-view" class="panel-view hidden" data-tab="problems"></div>
      </div>
    </section>

    <footer id="statusbar" aria-label="Status bar"></footer>
    <div id="keys-bar" class="hidden" aria-label="Coding keys"></div>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="gesture-hint" aria-hidden="true"></div>
  <input type="file" id="file-input" multiple hidden />
  <input type="file" id="zip-input" accept=".zip,application/zip" hidden />
  <input type="file" id="folder-input" webkitdirectory multiple hidden />

  <script type="module" src="main.js"></script>
</body>
</html>
